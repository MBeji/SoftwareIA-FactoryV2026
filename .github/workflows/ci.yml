name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # The end-to-end tests run real pytest, ruff and git in a local sandbox.
      - name: Install the tools used by the test sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
          pipx install pytest && pipx install ruff
      # The sandbox of the end-to-end tests inherits this PATH: fail here, with a clear
      # message, if a tool is missing from it.
      - name: Check the sandbox toolchain
        run: |
          command -v pytest ruff git bash timeout pdftotext
          pytest --version && ruff --version && git --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  sandbox:
    name: Docker sandbox isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build the sandbox image
        run: docker build -t omniforge-sandbox:latest sandbox/
      - name: Run the Docker sandbox tests
        working-directory: backend
        env:
          OMNIFORGE_TEST_DOCKER: "1"
        run: cargo test --test docker

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API image
        run: docker build -f backend/Dockerfile -t omniforge-api .
      - name: All-in-one demo image
        run: docker build -f backend/Dockerfile.demo -t omniforge-demo .
      - name: Web image
        run: docker build -t omniforge-web web
      - name: The demo image serves a complete run
        run: |
          docker run -d --name demo -e PORT=8080 -e OMNIFORGE_SIM_DELAY_MS=0 -p 127.0.0.1:8080:8080 omniforge-demo
          for i in $(seq 1 30); do curl -fs localhost:8080/health && break; sleep 1; done
          id=$(curl -fs -X POST localhost:8080/api/runs -H 'content-type: application/json' \
            -d '{"input":"Créer un endpoint FastAPI sécurisé avec JWT","supervision":{"default_mode":"autonomous"}}' | jq -r .id)
          for i in $(seq 1 120); do
            status=$(curl -fs "localhost:8080/api/runs/$id" | jq -r .status)
            case "$status" in completed) exit 0 ;; failed|cancelled|interrupted) break ;; esac
            sleep 1
          done
          curl -s "localhost:8080/api/runs/$id" | jq '{status, error}'
          docker logs demo
          exit 1
